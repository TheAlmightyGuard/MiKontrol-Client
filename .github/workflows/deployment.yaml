name: Discord Bot Deployment

on:
  push:
    branches:
      - 'release'
      - 'INTERNAL-4-WORKFLOW'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Action
        uses: actions/checkout@v6.0.2

      - name: Cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: SSH Deployment (Tunnel)
        run: |
          echo "HOST: ${{ vars.SSH_HOST }}"
          echo "USER: ${{ vars.SSH_USER }}"
          echo "ID: ${{ secrets.CF_CLIENT_ID }}"


          ssh -o ProxyCommand="cloudflared access ssh --hostname ${{ vars.SSH_HOST }} --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}" \
          ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} << 'EOF'
            cd /home/rpastor05/MiKontrol-Client
            echo *
          EOF
